<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Astronot Adventure 🚀</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🚀 ASTRONOT ADVENTURE 🚀</h1>

        <!-- INFORMASI GAME -->
        <div class="info">

            <div class="info-box">
                ⭐ SKOR
                <span id="score">0</span>
            </div>

            <div class="info-box">
                🎯 LEVEL
                <span id="level">1</span>
            </div>

            <div class="info-box">
                ❤️ NYAWA
                <span id="lives">5</span>
            </div>

        </div>


        <!-- AREA GAME -->
        <div id="gameArea">

            <div class="planet planet1">
                🪐
            </div>

            <div class="planet planet2">
                🌎
            </div>

            <div class="planet planet3">
                🌙
            </div>

            <div id="astronaut">
                👩‍🚀
            </div>

        </div>


        <!-- KONTROL -->
        <div class="controls">

            <button id="leftButton">
                ⬅️
            </button>

            <button id="rightButton">
                ➡️
            </button>

        </div>


        <p class="instruction">
            ⭐ Kumpulkan bintang untuk mendapatkan skor!
        </p>

        <p class="instruction">
            ☄️ Hindari meteor agar nyawa tidak berkurang!
        </p>


        <button
            class="restart"
            onclick="restartGame()">

            🔄 MULAI LAGI

        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
